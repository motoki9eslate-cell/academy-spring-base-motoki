<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
  <link rel="stylesheet" href="/css/top.css">
  <title>TOP</title>
</head>
<body class="top-page">
  <header>
    <h1>My Portfolio</h1>
     <form action="/logout" method="post" class="logout-form">
    <button type="submit" class="logout-button">
      ログアウト
    </button>
  </form>
  </header>

  <main>
    <section class="profile-section">
  <div class="profile-left">

    <div class="profile-image-area">
      <img
        th:if="${hasProfileImage}"
        th:src="@{/profile/image}"
        alt="プロフィール画像"
        class="profile-image">

      <div
        th:unless="${hasProfileImage}"
        class="profile-image-placeholder">
      </div>
    </div>

    <p th:text="${loginUser['name']}">アカデミー花子</p>
  </div>

  <div class="profile-right">
    <h2>自己紹介</h2>
    <div class="line"></div>

    <p
      class="profile-introduction"
      th:if="${loginUser['introduction'] != null}"
      th:text="${loginUser['introduction']}">
    </p>

    <p
      class="profile-introduction"
      th:unless="${loginUser['introduction'] != null}">
      自己紹介はまだ登録されていません
    </p>

    <div class="profile-button">
      <a th:href="@{/profile/edit}" class="edit-button">
        自己紹介を編集する
      </a>
    </div>
  </div>
</section>

    <section class="chart-section">
      <h2>学習チャート</h2>
      <div class="line chart-line"></div>
      <a th:href="@{/skills}" class="edit-button">
    編集する
</a>

      <div class="chart-area">
  <canvas id="learningChart"></canvas>
</div>
    </section>
  </main>

  <footer>portfolio site</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
  const backendData =
      /*[[${backendData}]]*/ [0, 0, 0];

  const frontendData =
      /*[[${frontendData}]]*/ [0, 0, 0];

  const infrastructureData =
      /*[[${infrastructureData}]]*/ [0, 0, 0];

  const allData = [
      ...backendData,
      ...frontendData,
      ...infrastructureData
  ];

  const maxValue = Math.max(...allData);

  const yMax = Math.max(
      100,
      Math.ceil(maxValue / 10) * 10
  );

  const ctx =
      document.getElementById('learningChart');

  new Chart(ctx, {
    type: 'bar',

    data: {
      labels: [
        '先々月',
        '先月',
        '今月'
      ],

      datasets: [
  {
    label: 'バックエンド',
    data: backendData,
    backgroundColor: 'rgba(255, 153, 178, 0.8)',
    barThickness: 60
  },
  {
    label: 'フロントエンド',
    data: frontendData,
    backgroundColor: 'rgba(255, 190, 130, 0.8)',
    barThickness: 60
  },
  {
    label: 'インフラ',
    data: infrastructureData,
    backgroundColor: 'rgba(255, 220, 145, 0.8)',
    barThickness: 60
  }
]
    },

    options: {
  responsive: true,
  maintainAspectRatio: false,
  animation: false,

  plugins: {
        title: {
          display: true,
          text: 'Chart.js Bar Chart',
          font: {
            family: 'Roboto',
            size: 14
          }
        },

        legend: {
          position: 'top',
          labels: {
            font: {
              family: 'Roboto',
              size: 14
            }
          }
        }
      },

      scales: {
        x: {
          ticks: {
            font: {
              family: 'Roboto',
              size: 14
            }
          }
        },

        y: {
          beginAtZero: true,
          max: yMax,

          ticks: {
            stepSize:
                yMax === 100
                    ? 10
                    : undefined,

            font: {
              family: 'Roboto',
              size: 14
            }
          }
        }
      }
    }
  });
</script>

</body>
</html>
