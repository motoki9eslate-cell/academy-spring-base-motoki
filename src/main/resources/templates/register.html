<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/top.css}">
  <title>新規登録</title>
</head>

<body class="auth-page">

  <header class="auth-header has-button">
    <h1>My Portfolio</h1>

    <a th:href="@{/login}" class="auth-header-button">
      ログイン
    </a>
  </header>

  <main class="auth-main">
    <h2 class="auth-title">新規登録</h2>

    <form
        class="auth-form"
        th:action="@{/register}"
        method="post"
        novalidate>

      <!-- 氏名 -->
      <div class="auth-field">
        <label for="name">氏名</label>

        <input
            id="name"
            type="text"
            name="name"
            placeholder="アカデミー花子"
            th:value="${name}">

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(errors, '氏名を入力してください')}">
          氏名を入力してください
        </p>

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    '氏名は256文字以内で入力してください'
                )}">
          氏名は256文字以内で入力してください
        </p>
      </div>

      <!-- メールアドレス -->
      <div class="auth-field">
        <label for="email">メールアドレス</label>

        <input
            id="email"
            type="email"
            name="email"
            placeholder="tatsuya.yokokura@prum.jp"
            th:value="${email}">

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    'メールアドレスを入力してください'
                )}">
          メールアドレスを入力してください
        </p>

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    '正しいメールアドレスを入力してください'
                )}">
          正しいメールアドレスを入力してください
        </p>

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    'このメールアドレスは既に登録されています'
                )}">
          このメールアドレスは既に登録されています
        </p>
      </div>

      <!-- パスワード -->
      <div class="auth-field">
        <label for="password">パスワード</label>

        <input
            id="password"
            type="password"
            name="password"
            placeholder="パスワード">

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    'パスワードを入力してください'
                )}">
          パスワードを入力してください
        </p>

        <p
            class="auth-error"
            th:if="${errors != null
                and #lists.contains(
                    errors,
                    'パスワードは英数8文字以上で入力してください'
                )}">
          パスワードは英数8文字以上で入力してください
        </p>
      </div>

      <button class="auth-submit-button" type="submit">
        登録する
      </button>

    </form>
  </main>

  <footer class="auth-footer">
    portfolio site
  </footer>

</body>
</html>
