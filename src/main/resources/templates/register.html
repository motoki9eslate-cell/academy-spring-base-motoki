<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/top.css}">
  <title>新規登録</title>
</head>

<body class="auth-page">

  <header class="auth-header has-button">
    <h1>My Portfolio</h1>

    <a th:href="@{/login}" class="auth-header-button">
      ログイン
    </a>
  </header>

  <main class="auth-main">
    <h2 class="auth-title">新規登録</h2>

    <form
        class="auth-form"
        th:action="@{/register}"
        method="post"
        novalidate>

      <div class="auth-field">
        <label for="name">氏名</label>

        <input
            id="name"
            type="text"
            name="name"
            placeholder="アカデミー花子"
            th:value="${name}">

        <!-- 氏名エラーはこのdiv内 -->
      </div>

      <div class="auth-field">
        <label for="email">メールアドレス</label>

        <input
            id="email"
            type="email"
            name="email"
            placeholder="tatsuya.yokokura@prum.jp"
            th:value="${email}">

        <!-- メールアドレスエラーはこのdiv内 -->
      </div>

      <div class="auth-field">
        <label for="password">パスワード</label>

        <input
            id="password"
            type="password"
            name="password"
            placeholder="パスワード">

        <!-- パスワードエラーはこのdiv内 -->
      </div>

      <button class="auth-submit-button" type="submit">
        登録する
      </button>

    </form>
  </main>

  <footer class="auth-footer">
    portfolio site
  </footer>

</body>
</html>
